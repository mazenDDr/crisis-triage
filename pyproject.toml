[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crisis-triage"
version = "0.1.0"
description = "Multilingual crisis message triage with Laya, measured against LLMs for accuracy, calibration, speed and cost"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
laya = [
  "laya==0.3.5",
  "torch>=2.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crisis_triage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
